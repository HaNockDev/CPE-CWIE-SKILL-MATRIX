<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;font-family:'Noto Sans Thai',sans-serif">
  <sc-if value="{{ isRadar }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative;width:100%;aspect-ratio:360 / 260">
    <svg viewBox="0 0 360 260" role="img" aria-label="{{ aria }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible">
      <sc-for list="{{ rings }}" as="r" hint-placeholder-count="5">
        <polygon points="{{ r.points }}" style="fill:none;stroke:var(--line-strong);stroke-width:1"></polygon>
      </sc-for>
      <sc-for list="{{ spokes }}" as="s" hint-placeholder-count="4">
        <line x1="{{ s.x1 }}" y1="{{ s.y1 }}" x2="{{ s.x2 }}" y2="{{ s.y2 }}" style="stroke:var(--line-strong);stroke-width:1"></line>
      </sc-for>
      <sc-if value="{{ hasValues }}">
        <polygon points="{{ valuePts }}" style="fill:var(--primary);fill-opacity:0.18;stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round"></polygon>
      </sc-if>
      <sc-if value="{{ hasAvg }}">
        <polygon points="{{ avgPts }}" style="fill:none;stroke:var(--avg);stroke-width:2;stroke-dasharray:6 4;stroke-linejoin:round"></polygon>
      </sc-if>
      <sc-for list="{{ dots }}" as="d">
        <circle cx="{{ d.x }}" cy="{{ d.y }}" r="4.5" style="fill:var(--primary);stroke:var(--surface);stroke-width:2"></circle>
      </sc-for>
    </svg>
    <sc-for list="{{ ringLabels }}" as="t">
      <div style="position:absolute;left:{{ t.x }};top:{{ t.y }};transform:translate(4px,-50%);font-size:11px;line-height:1;font-weight:700;color:var(--ink-3);background:var(--surface);padding:1px 3px;border-radius:3px">{{ t.label }}</div>
    </sc-for>
    <sc-for list="{{ labels }}" as="l" hint-placeholder-count="4">
      <div style="position:absolute;left:{{ l.x }};top:{{ l.y }};transform:{{ l.tf }};font-size:13px;line-height:1.3;font-weight:600;color:var(--ink);white-space:nowrap">{{ l.label }}</div>
    </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ isBars }}">
    <div style="display:flex;flex-direction:column;gap:14px;padding:8px 0">
      <sc-for list="{{ bars }}" as="b">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;color:var(--ink)"><span>{{ b.label }}</span><span>{{ b.valueLabel }}</span></div>
          <div style="position:relative;height:14px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-strong)">
            <div style="position:absolute;left:0;top:0;bottom:0;width:{{ b.w }};background:var(--primary);border-radius:3px"></div>
            <div style="position:absolute;top:-4px;bottom:-4px;left:{{ b.a }};border-left:2px dashed var(--avg)"></div>
          </div>
        </div>
      </sc-for>
      <div style="font-size:12px;color:var(--ink-3)">แสดงเป็นแถบเมื่อมีน้อยกว่า 3 กลุ่มวิชา</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:280},&quot;axes&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;values&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;avg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const axes = this.props.axes || ['Software', 'Robot & Auto', 'Cyber', 'Soft Skill'];
    const values = this.props.values || [];
    const avg = this.props.avg || [];
    const n = axes.length, cx = 180, cy = 130, R = 86, max = 5;
    const pt = (i, v) => { const a = (-90 + (360 * i) / n) * Math.PI / 180; return [cx + Math.cos(a) * R * v / max, cy + Math.sin(a) * R * v / max]; };
    const f = x => Math.round(x * 10) / 10;
    const poly = vals => vals.map((v, i) => pt(i, v).map(f).join(',')).join(' ');
    if (n < 3) {
      return { isRadar: false, isBars: true, bars: axes.map((l, i) => ({ label: l, valueLabel: (values[i] ?? 0).toFixed(1) + ' / 5', w: ((values[i] ?? 0) / 5 * 100) + '%', a: ((avg[i] ?? 0) / 5 * 100) + '%' })) };
    }
    const rings = [1, 2, 3, 4, 5].map(k => ({ points: poly(Array(n).fill(k)) }));
    const spokes = axes.map((_, i) => { const [x2, y2] = pt(i, max); return { x1: cx, y1: cy, x2: f(x2), y2: f(y2) }; });
    const px = x => (x / 360 * 100).toFixed(2) + '%', py = y => (y / 260 * 100).toFixed(2) + '%';
    const ringLabels = [1, 2, 3, 4, 5].map(k => { const [x, y] = pt(0, k); return { x: px(x), y: py(y), label: String(k) }; });
    const labels = axes.map((l, i) => {
      const a = (-90 + (360 * i) / n) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
      const x = cx + c * (R + 10), y = cy + s * (R + 10);
      const tx = c > 0.25 ? '0' : c < -0.25 ? '-100%' : '-50%', ty = s < -0.3 ? '-100%' : s > 0.3 ? '0' : '-50%';
      return { label: l, x: px(x), y: py(y), tf: 'translate(' + tx + ',' + ty + ')' };
    });
    const aria = 'แผนภูมิใยแมงมุม ' + axes.map((l, i) => l + ' ระดับ ' + (values[i] ?? '-') + (avg[i] != null ? ' ค่าเฉลี่ย ' + avg[i] : '')).join(', ');
    return {
      isRadar: true, isBars: false, rings, spokes, ringLabels, labels, aria,
      hasValues: values.length === n, valuePts: poly(values),
      hasAvg: avg.length === n, avgPts: poly(avg),
      dots: values.length === n ? values.map((v, i) => { const [x, y] = pt(i, v); return { x: f(x), y: f(y) }; }) : []
    };
  }
}
</script>
</body>
</html>
